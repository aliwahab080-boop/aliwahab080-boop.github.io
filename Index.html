<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SALIMA</title>
<style>
body{background:#0f0f0f;color:#fff;font-family:Arial;margin:0;padding:10px}
.top{background:#1db954;border-radius:15px;padding:15px}
.tabs{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px;margin:12px 0}
.tabs button{background:#222;color:#fff;border:none;padding:12px 5px;border-radius:12px}
.tabs button.active{background:#ffcc00;color:#000}
.card{background:#1e1e1e;border-radius:15px;padding:15px;display:none}
.card.active{display:block}
input,select{width:100%;padding:12px;margin:6px 0 12px;background:#333;color:#fff;border:none;border-radius:10px;box-sizing:border-box}
.save{background:#ffcc00;width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold}
</style>
</head>
<body>
<div class="top"><h2>124 000 FCFA</h2><p>💳 SAL-99963777 | 🟡 Pi : <span id="piBadge">Non configuré</span></p><p>1 Pi = 315 000 FCFA</p></div>
<div class="tabs">
<button onclick="showTab('pays',this)">🌍 Pays</button>
<button onclick="showTab('envoi',this)">✈️ Envoi</button>
<button onclick="showTab('profil',this)" class="active">👤 Profil</button>
<button onclick="showTab('facture',this)">🧾 Facture</button>
<button onclick="showTab('cpt',this)">👥 Cpt à Cpt</button>
<button onclick="showTab('banque',this)">🏦 Banque</button>
<button onclick="showTab('pi',this)">🟡 Pi</button>
<button onclick="showTab('recu',this)">📄 Reçu</button>
</div>
<div id="pays" class="card"><h3>🌍 Pays</h3><select><option>Niger</option><option>Mali</option><option>Bénin</option><option>Sénégal</option></select><button class="save" onclick="alert('Pays choisi')">Valider</button></div>
<div id="envoi" class="card"><h3>✈️ Envoi</h3><input placeholder="Nom bénéficiaire"><input placeholder="Téléphone"><input type="number" placeholder="Montant FCFA"><button class="save" onclick="alert('Envoi enregistré')">Envoyer</button></div>
<div id="profil" class="card active"><h3>👤 Profil</h3><input value="Ali Abdoulwahab"><input value="99963777"><button class="save" onclick="alert('Profil sauvegardé')">Sauvegarder</button></div>
<div id="facture" class="card"><h3>🧾 Facture</h3><p>Total : 125 000 FCFA</p><button class="save" onclick="alert('Facture générée')">Générer</button></div>
<div id="cpt" class="card"><h3>👥 Cpt à Cpt</h3><input value="SAL-99963777"><input placeholder="Vers SAL-..."><input type="number" placeholder="Montant"><button class="save" onclick="alert('Transfert fait')">Transférer</button></div>
<div id="banque" class="card"><h3>🏦 Banque</h3><select><option>BOA Niger</option><option>Ecobank</option></select><input placeholder="N° compte"><button class="save" onclick="alert('Envoi banque')">Envoyer</button></div>
<div id="pi" class="card"><h3>🟡 Payer avec Pi</h3><p>✅ TU ES DANS PI !</p><input id="walletPi" placeholder="Wallet Pi G..."><input id="montantPi" type="number" placeholder="Montant Pi"><button class="save" onclick="sauvegarderPi()">SAUVEGARDER PI</button><p id="piResult"></p></div>
<div id="recu" class="card"><h3>📄 Reçu</h3><p>Ali Abdoulwahab - 124 000 FCFA - Payé</p><button class="save" onclick="alert('Reçu prêt')">Imprimer</button></div>
<script>
function showTab(id,btn){var c=document.querySelectorAll('.card');for(var i=0;i<c.length;i++){c[i].classList.remove('active');}document.getElementById(id).classList.add('active');var t=document.querySelectorAll('.tabs button');for(var j=0;j<t.length;j++){t[j].classList.remove('active');}if(btn){btn.classList.add('active');}}
function sauvegarderPi(){var w=document.getElementById('walletPi').value;var m=document.getElementById('montantPi').value;if(!w||w.length<5){alert('Mets ton Wallet Pi');return;}document.getElementById('piBadge').innerHTML='Configuré';document.getElementById('piResult').innerHTML='✅ '+w+' = '+(m*315000)+' FCFA';alert('PI CONFIGURE !');}
</script>
</body>
  </html>
