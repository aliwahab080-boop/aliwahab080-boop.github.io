<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salima V2 - Transfert Pi</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{margin:0;background:#4c1d95;padding:0;font-family:Arial;color:#111}
.header{background:#4c1d95;color:white;padding:22px;text-align:center}
.header h1{margin:0;font-size:34px}
.header p{margin:5px;opacity:.8;font-size:13px}
.card{background:#fff;margin:-12px 12px 12px;border-radius:24px;padding:20px}
.balance-box{background:#f3e8ff;border-radius:16px;padding:16px;text-align:center}
.balance{font-size:32px;font-weight:900;color:#4c1d95}
.btn{width:100%;padding:15px;border:none;border-radius:14px;font-size:16px;font-weight:800;margin-top:10px;cursor:pointer}
.btn-pi{background:#7c3aed;color:#fff}
.btn-send{background:#16a34a;color:#fff}
.btn-grey{background:#eee}
input,select{width:100%;padding:14px;border:1px solid #ddd;border-radius:12px;margin-top:10px;font-size:16px;box-sizing:border-box}
.hidden{display:none}
.item{display:flex;justify-content:space-between;background:#f9f9f9;padding:12px;border-radius:12px;margin-top:8px;font-size:14px}
</style>
</head>
<body>
<div class="header"><h1>💜 SALIMA</h1><p>Transfert Pi • Niger • Rapide & Sûr</p></div>
<div class="card">
<div id="loginBox">
<p style="text-align:center">Bienvenue sur Salima !<br>Connecte-toi pour envoyer du Pi.</p>
<button class="btn btn-pi" onclick="loginPi()">🟣 SE CONNECTER AVEC PI</button>
<p style="text-align:center;font-size:12px;color:#888">100% sécurisé avec Pi Network</p>
</div>
<div id="appBox" class="hidden">
<div class="balance-box"><div id="userName">Bonjour</div><div class="balance" id="solde">10.00 Pi</div><div style="font-size:12px;color:#666">Solde disponible</div></div>
<input id="dest" placeholder="📱 @pseudo Pi ou +227 ...">
<input id="montant" type="number" value="1" placeholder="Montant en Pi">
<select id="pays"><option>🇳🇪 Niger - Niamey</option><option>🇳🇬 Nigeria</option><option>🇧🇯 Bénin</option><option>🇹🇬 Togo</option><option>🇲🇱 Mali</option></select>
<button class="btn btn-send" onclick="envoyer()">💸 ENVOYER MAINTENANT</button>
<button class="btn btn-grey" onclick="alert('Demande à quelqu’un de t’envoyer du Pi sur @salima')">➕ RECEVOIR DU PI</button>
<div id="msg" style="text-align:center;margin-top:12px"></div>
<h3>Historique</h3>
<div id="hist"><div class="item"><span>🎉 Bonus bienvenue</span><b style="color:green">+10 Pi</b></div></div>
</div>
</div>
<script>
Pi.init({version:"2.0",sandbox:false});
let solde=10;
async function loginPi(){
try{
let a=await Pi.authenticate(['username','payments'],()=>{});
document.getElementById('userName').innerText="Bonjour @"+a.user.username+" 👋";
document.getElementById('loginBox').classList.add('hidden');
document.getElementById('appBox').classList.remove('hidden');
}catch(e){alert("Ouvre ce lien dans Pi Browser, pas Chrome");}
}
async function envoyer(){
let d=document.getElementById('dest').value;
let m=parseFloat(document.getElementById('montant').value);
if(!d||!m){alert("Mets le destinataire et le montant");return;}
if(m>solde){alert("Solde insuffisant");return;}
try{
await Pi.createPayment({amount:m,memo:"Salima vers "+d,metadata:{dest:d}},{onReadyForServerApproval:()=>{},onReadyForServerCompletion:(id,tx)=>{
solde-=m;document.getElementById('solde').innerText=solde.toFixed(2)+" Pi";
document.getElementById('msg').innerHTML="✅ Envoyé "+m+" Pi vers "+d;
document.getElementById('hist').innerHTML='<div class="item"><span>💸 Vers '+d+'</span><b style="color:red">-'+m+' Pi</b></div>'+document.getElementById('hist').innerHTML;
},onCancel:()=>alert("Annulé"),onError:(e)=>alert(e)});
}catch(e){alert(e.message);}
}
</script>
</body>
                                       </html>
